syntax = "proto3";

package ratelimit;

service RateLimiter {
  rpc Check (RateLimitRequest) returns (RateLimitDecision);
}

message RateLimitRequest {
  string client_ip = 1;
  string identity_type = 2;
  string api_key = 3;
  string user_id = 4;
  string tenant_id = 5;
  string method = 6;
  string endpoint = 7;
}

message RateLimitDecision {
  string request_id = 1;
  string protocol = 2;
  string identity = 3;
  string target_instance = 4;
  string endpoint = 5;
  string method = 6;
  string algorithm = 7;
  bool allowed = 8;
  string decision = 9;
  int32 status = 10;
  int32 latency = 11;
  int32 remaining = 12;
  int32 retry_after = 13;
  int32 delayed_ms = 14;
  string reason = 15;
}
